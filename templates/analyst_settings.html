{% extends "base.html" %}

{% block title %}Settings{% endblock %}
{% block page_title %}Analyst Security & Account Settings{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <div>
        <h3 style="margin: 0;">Change Password</h3>
        <span style="font-size: 12px; color: #64748b;">Ensure your account is protected with a secure password</span>
      </div>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('analyst_settings') }}">
        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label" for="current_password" style="font-weight: 600;">Current Password</label>
          <input 
            type="password" 
            id="current_password" 
            name="current_password" 
            class="form-control" 
            required 
            placeholder="Enter your current password"
          />
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label" for="new_password" style="font-weight: 600;">New Password</label>
          <input 
            type="password" 
            id="new_password" 
            name="new_password" 
            class="form-control" 
            required 
            minlength="6"
            placeholder="Minimum 6 characters"
          />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="confirm_password" style="font-weight: 600;">Confirm New Password</label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            required 
            minlength="6"
            placeholder="Repeat new password"
          />
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px;">
          <a href="{{ url_for('analyst_dashboard') }}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
